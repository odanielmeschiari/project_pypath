<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preload" as="image" href="https://i.ibb.co/FkbxgnWw/m-quina-do-tempo-fundo.png">
    <link rel="preload" as="image" href="https://i.ibb.co/ns59HJLM/babbage-fundo.png">
    <link rel="preload" as="image" href="https://i.ibb.co/rGm8CDRM/Your-paragraph-text-7.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Sixtyfour&display=swap" rel="stylesheet">    
    <style>
        :root{
            --color-text: white;
            --ff-title: "Roboto", sans-serif;
            --ff-p: "Pixelify Sans", sans-serif;
            --ff-info: "Sixtyfour", sans-serif;
            --main-color: rgb(138, 206, 191);
        }

        body{
            background-color: black;
            height: 98vh;
            width: 98%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 0 auto;
        }

        #black-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.21); 
            z-index: 9999;
            display: none;
            pointer-events: none;
            opacity: 0;
        }

        .overlayFadeIn {
            display: block !important;
            animation: fadeInOverlay 0.5s forwards;
        }

        @keyframes fadeInOverlay {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Caixa de diálogo original (NÃO MEXER) */
        #dialog-box {
            display: none;
            position: fixed;
            top: 40px;
            left: 40px;
            max-width: 422px;
            max-height: 222px;
            background-color: white;
            border: 1px solid #5e17eb;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10000;
            justify-content: center;
            align-items: center;
            text-align: justify;
        }

        /* Nova caixa de diálogo EXCLUSIVA para o Babbage - Ajustada */
        #babbage-dialog-box {
            display: none; /* Escondida inicialmente */
            position: fixed;
            top: 40px;
            /* Posicionado à direita da foto (aproximado de 310px para 300px) */
            left: 300px; 
            max-width: 422px;
            min-height: 100px;
            background-color: white;
            border: 2px solid #bf9970; /* Borda aumentada e cor alterada */
            padding: 20px;
            box-sizing: border-box;
            z-index: 10000; /* Mesma camada que a foto */
            justify-content: center;
            align-items: center;
            text-align: justify;
        }

        #dialog-text, #babbage-dialog-text {
            font-family: var(--ff-p);
            color: black;
            font-size: 18px;
            margin: 0;
            line-height: 1.4;
        }

        #press-to-proceed {
            display: none;
            position: absolute;
            bottom: 30px;
            font-family: var(--ff-p);
            color: var(--color-text);
            font-size: 20px;
            z-index: 10001;
            animation: fadeIn 0.5s forwards;
        }

        #user-name-container {
            display: none;
            position: absolute;
            bottom: 40px;
            flex-direction: column;
            align-items: center;
            z-index: 10001;
        }

        #user-name-label {
            font-family: var(--ff-p);
            color: white;
            font-size: 24px;
            margin-bottom: 10px;
        }

        #userNameInput {
            background-color: rgb(69, 76, 80);
            border-radius: 5px;
            border: 2px solid var(--main-color);
            outline: none;
            padding: 10px 25px;
            font-family: var(--ff-p);
            font-size: 25px;
            color: white;
            text-align: center;
        }

        #travel-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 20000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: var(--ff-p);
            font-size: 40px;
        }

        h1, h2, h3{
            font-family: var(--ff-title);
            color: var(--color-text);
        }

        span{
            color: var(--main-color);
            font-family: var(--ff-p);
            animation-name: animation;
            animation-duration: 3s;
            display: flex;
        }

        #main-text, span{
            font-size: 70px;
        }

        #inputName{
            background-color: rgb(69, 76, 80);
            border-radius: 5px;
            border: none;
            outline: none;
            padding: 10px 25px;
            font-family: var(--ff-p);
            font-weight: bold;
            font-size: 30px;
            color: white;
        }

        #press-space {
            position: absolute;
            bottom: 30px;
            font-family: var(--ff-p);
            color: var(--color-text);
            opacity: 0;
            font-size: 20px;
            animation: fadeIn 1s forwards;
            animation-delay: 3s;
        }

        #final-image-container {
            display: none;
            width: 100vw;
            height: 100vh;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
        }

        #final-image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
        }

        /* Estilo para a foto do NPC Babbage - Posicionado à esquerda */
        #npc-babbage-photo {
            display: none; 
            position: fixed;
            top: 40px; 
            left: 40px; 
            max-width: 250px; 
            height: auto;
            z-index: 10000; 
            opacity: 0; 
        }

        .imageFadeIn {
            animation: fadeIn 0.5s forwards;
        }

        .sceneFadeIn {
            animation: fadeIn 0.5s forwards;
        }

        .fadeOutScene {
            animation: fadeOutAnim 1s forwards !important;
        }

        @keyframes fadeOutAnim {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        .blockBody{
            display: none;
            opacity: 0;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes animation {
            0% {opacity: 0; transform: translate(0, 100px);}
            100% {opacity: 1; transform: translateY(0, -100px);}
        }

        @keyframes startAnimation {
            0% {opacity: 1; transform: translateY(0); display: flex;}
            100% {opacity: 0; transform: translateY(-300px); visibility: hidden;}
        }

    </style>
</head>
<body>
    <div id="black-overlay"></div>

    <div id="dialog-box">
        <p id="dialog-text"></p>
    </div>

    <div id="babbage-dialog-box">
        <p id="babbage-dialog-text"></p>
    </div>

    <div id="press-to-proceed">< aperte espaço para prosseguir ></div>

    <div id="user-name-container">
        <label id="user-name-label">Como você gostaria de ser chamado?</label>
        <input id="userNameInput" type="text" placeholder="Seu nome..." autocomplete="off">
    </div>

    <div id="travel-screen">
        <div id="travel-text"></div>
        <div id="year-display" style="font-size: 60px; margin-top: 20px; color: var(--main-color);"></div>
    </div>

    <h1 class="startAnimation" id="main-text">Bem vindo ao <span class="startAnimation">Project Pypath!</span></h1>

    <div id="press-space">< aperte espaço para começar ></div>

    <div class="firstChain blockBody">
        <h1 id="mainTextFirstChain" style="font-size: 70px; color: var(--main-color); text-align: center; font-family: var(--ff-p);">Comece sua Jornada!</h1>
        <h1 id="firstChainTest" style="color: rgb(101, 111, 117); font-family: var(--ff-p);">print("hello world")</h1>
        <input id="inputName" type="text" placeholder='código aqui' autocomplete="off">
    </div>

    <div id="final-image-container">
        <img id="npc-image" src="https://i.ibb.co/FkbxgnWw/m-quina-do-tempo-fundo.png" alt="cenario">
    </div>

    <img id="npc-babbage-photo" src="https://i.ibb.co/rGm8CDRM/Your-paragraph-text-7.png" alt="Charles Babbage">

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTypingSound() {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sine'; 
            oscillator.frequency.setValueAtTime(600, audioCtx.currentTime); 
            oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
            gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.05);
        }

        const mainText = document.getElementById('main-text');
        const pressSpaceLabel = document.getElementById('press-space');
        const inputName = document.getElementById("inputName");
        const firstChain = document.querySelector(".firstChain");
        const imageContainer = document.getElementById("final-image-container");
        const npcImage = document.getElementById("npc-image");
        const blackOverlay = document.getElementById("black-overlay");
        const dialogBox = document.getElementById("dialog-box");
        const dialogTextElement = document.getElementById("dialog-text");
        
        // Nova variável para a caixa do Babbage
        const babbageDialogBox = document.getElementById("babbage-dialog-box");
        const babbageDialogTextElement = document.getElementById("babbage-dialog-text");

        const pressToProceed = document.getElementById("press-to-proceed");
        const userNameContainer = document.getElementById("user-name-container");
        const userNameInput = document.getElementById("userNameInput");
        const travelScreen = document.getElementById("travel-screen");
        const travelTextElement = document.getElementById("travel-text");
        const npcBabbagePhoto = document.getElementById("npc-babbage-photo");
        const yearDisplay = document.getElementById("year-display");

        // Textos originais (Mantidos para a máquina do tempo)
        const texts = [
            "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Nam vehicula sit amet risus in convallis. Pellentesque pellentesque, nibh id accumsan rutrum, lectus turpis cursus mi, a efficitur turpis velit non neque. In in diam in nisi viverra porta. Aliquam vestibulum elementum urna.",
            "Pellentesque pellentesque, nibh id accumsan rutrum, lectus turpis cursus mi, a efficitur turpis velit non neque?"
        ];
        
        // Texto exclusivo para a cena do Babbage
        const babbageWelcomeText = "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Nam vehicula sit amet risus in convallis. Pellentesque pellentesque, nibh id accumsan rutrum, lectus turpis cursus mi, a efficitur turpis velit non neque. In in diam in nisi viverra porta. Aliquam vestibulum elementum urna.";

        const targetText = 'print("hello world")';
        
        let currentTextIndex = 0;
        let canProceed = false;
        let dotsInterval;
        let playerNickname = "";
        let isAtBabbageScene = false; // Controle para saber se estamos na cena do Babbage

        function changeBodyType(element, change){
            if(change === "add"){
                element.classList.add("currentAnimation");
                element.classList.remove("blockBody");
            } else {
                element.classList.remove("currentAnimation");
                element.classList.add("blockBody");
            }
        }

        function typeWriter(text, element, speed, callback) {
            canProceed = false;
            let i = 0;
            element.innerHTML = "";
            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    if (text.charAt(i) !== " ") playTypingSound();
                    i++;
                    setTimeout(type, speed);
                } else if(callback) {
                    callback();
                }
            }
            type();
        }

        function animateDots() {
            let dots = "";
            dotsInterval = setInterval(() => {
                dots = dots.length < 3 ? dots + "." : "";
                travelTextElement.innerHTML = "Viajando pelo tempo" + dots;
                if (dots !== "") playTypingSound();
            }, 400);
        }

        function showNextDialog() {
            pressToProceed.style.display = "none";
            dialogTextElement.innerHTML = "";
            
            typeWriter(texts[currentTextIndex], dialogTextElement, 30, () => {
                setTimeout(() => {
                    pressToProceed.style.display = "block";
                    canProceed = true;
                }, 500);
            });
        }

        function loadNewScene() {
            travelScreen.style.display = "none";
            
            npcImage.src = "https://i.ibb.co/ns59HJLM/babbage-fundo.png";
            npcImage.classList.remove("imageFadeIn", "fadeOutScene");
            
            blackOverlay.classList.remove("fadeOutScene", "overlayFadeIn");
            blackOverlay.style.display = "none";
            blackOverlay.style.opacity = "0";

            imageContainer.style.display = "flex";
            npcImage.classList.add("sceneFadeIn");

            setTimeout(() => {
                npcBabbagePhoto.style.display = "block"; 
                npcBabbagePhoto.classList.add("imageFadeIn"); 
                
                // Exibe a NOVA caixa de diálogo do Babbage e inicia a digitação
                setTimeout(() => {
                    isAtBabbageScene = true; // Marca que estamos na cena do Babbage
                    babbageDialogBox.style.display = "flex";
                    
                    // Digita o texto exclusivo na nova caixa
                    typeWriter(babbageWelcomeText, babbageDialogTextElement, 30, () => {
                        // O que acontece quando termina de digitar? (Vamos definir depois)
                    });
                }, 600);
            }, 500);

            setTimeout(() => {
                blackOverlay.classList.add("overlayFadeIn");
            }, 100);
        }

        function startTimeTravel() {
            npcImage.classList.add("fadeOutScene");
            blackOverlay.classList.add("fadeOutScene");
            dialogBox.classList.add("fadeOutScene");
            userNameContainer.classList.add("fadeOutScene");

            setTimeout(() => {
                userNameContainer.style.display = "none";
                travelScreen.style.display = "flex";
                
                typeWriter("Viajando pelo tempo", travelTextElement, 50, () => {
                    animateDots();

                    let duration = 1000; 
                    let startTime = Date.now();
                    let shuffleInterval = setInterval(() => {
                        let elapsed = Date.now() - startTime;
                        if (elapsed < duration) {
                            yearDisplay.innerHTML = Math.floor(1000 + Math.random() * 9000);
                        } else {
                            clearInterval(shuffleInterval);
                            yearDisplay.innerHTML = "1832";
                        }
                    }, 50);

                    setTimeout(() => {
                        clearInterval(dotsInterval);
                        travelTextElement.innerHTML = "";
                        yearDisplay.innerHTML = "";
                        
                        setTimeout(() => {
                            loadNewScene();
                        }, 1000); 

                    }, 3000); 
                });
            }, 500); 
        }

        inputName.addEventListener("input", () => {
            const currentValue = inputName.value;
            if (targetText.startsWith(currentValue)) {
                inputName.style.color = 'rgb(153, 238, 153)';
            } else {
                inputName.style.color = 'rgb(255, 111, 111)';
            }
        });

        inputName.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && inputName.value === targetText) {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                firstChain.style.animation = "startAnimation 1s forwards";
                setTimeout(() => {
                    firstChain.style.display = "none";
                    imageContainer.style.display = "flex";
                    npcImage.classList.add("imageFadeIn");
                    blackOverlay.classList.add("overlayFadeIn");
                    setTimeout(() => {
                        dialogBox.style.display = "flex";
                        showNextDialog();
                    }, 1500); 
                }, 1000);
            }
        });

        userNameInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && userNameInput.value.trim() !== "") {
                playerNickname = userNameInput.value;
                startTimeTravel();
            }
        });

        document.addEventListener("keydown", (event) => {
            if (event.code === "Space") {
                if (audioCtx.state === 'suspended') audioCtx.resume();

                if (mainText.style.display !== "none") {
                    mainText.style.animation = "startAnimation 1s forwards";
                    pressSpaceLabel.style.animation = "startAnimation 1s forwards";
                    setTimeout(() => {
                        mainText.style.display = "none";
                        pressSpaceLabel.style.display = "none";
                        changeBodyType(firstChain, "add");
                        inputName.value = "";
                        inputName.focus();
                    }, 1000);
                } 
                // Lógica de prosseguir diálogo (apenas na cena da máquina do tempo)
                else if (canProceed && !isAtBabbageScene) {
                    currentTextIndex++;
                    if (currentTextIndex < texts.length) {
                        showNextDialog();
                    } else {
                        canProceed = false;
                        pressToProceed.style.display = "none";
                        userNameContainer.style.display = "flex";
                        userNameInput.value = "";
                        userNameInput.focus();
                    }
                }
            }
        });

        window.onload = () => {
            inputName.value = "";
            userNameInput.value = "";
        };
    </script>
</body>
</html>
